<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cl&#237;nica M&#233;dica</title>
    <h:outputStylesheet library="manhattan-layout" name="css/layout-blue-grey.css"/>
    <style>
        :root {
            --cm-primary:   #1976D2;
            --cm-primary-d: #1565C0;
            --cm-accent:    #26A69A;
            --cm-sidebar-w: 240px;
            --cm-topbar-h:  56px;
            --cm-bg:        #F5F7FA;
            --cm-surface:   #FFFFFF;
            --cm-border:    #E0E0E0;
            --cm-text:      #37474F;
            --cm-text-muted:#78909C;
            --cm-shadow:    0 2px 8px rgba(0,0,0,.10);
            --cm-radius:    8px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--cm-bg);
            color: var(--cm-text);
        }

        .cm-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .cm-sidebar {
            width: var(--cm-sidebar-w);
            background: #263238;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .cm-sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px 16px;
            background: #1C282E;
            color: #ECEFF1;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .3px;
            text-decoration: none;
            border-bottom: 1px solid #37474F;
        }
        .cm-sidebar-logo .logo-icon {
            width: 34px; height: 34px;
            background: var(--cm-primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .cm-menu-section { padding: 20px 0 4px; }
        .cm-menu-section-label {
            font-size: .67rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #607D8B;
            padding: 0 20px 6px;
        }
        .cm-menu-section ul { list-style: none; margin: 0; padding: 0; }
        .cm-menu-section ul li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: #B0BEC5;
            text-decoration: none;
            font-size: .9rem;
            border-left: 3px solid transparent;
            transition: background .15s, color .15s, border-color .15s;
        }
        .cm-menu-section ul li a:hover {
            background: rgba(255,255,255,.06);
            color: #ECEFF1;
            border-left-color: var(--cm-primary);
        }
        .cm-menu-section ul li a i {
            font-size: 1rem;
            width: 18px;
            text-align: center;
            color: #607D8B;
            transition: color .15s;
        }
        .cm-menu-section ul li a:hover i { color: var(--cm-primary); }

        /* Footer sidebar */
        .cm-sidebar-footer {
            margin-top: auto;
            padding: 14px 20px;
            border-top: 1px solid #37474F;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cm-sidebar-footer .avatar {
            width: 34px; height: 34px;
            background: var(--cm-accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: .85rem; font-weight: 700;
            flex-shrink: 0;
        }
        .cm-sidebar-footer .user-info { flex: 1; min-width: 0; }
        .cm-sidebar-footer .user-name {
            font-size: .82rem; font-weight: 600;
            color: #ECEFF1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cm-sidebar-footer .user-role { font-size: .72rem; color: #607D8B; }

        .cm-logout-btn {
            background: transparent !important;
            border: none !important;
            cursor: pointer;
            color: #607D8B;
            padding: 6px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: color .15s, background .15s;
        }
        .cm-logout-btn:hover {
            color: #EF5350 !important;
            background: rgba(239,83,80,.1) !important;
        }

        /* ── MAIN ── */
        .cm-main {
            margin-left: var(--cm-sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* ── TOPBAR ── */
        .cm-topbar {
            height: var(--cm-topbar-h);
            background: var(--cm-surface);
            border-bottom: 1px solid var(--cm-border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            position: sticky;
            top: 0; z-index: 900;
            gap: 12px;
        }
        .cm-topbar-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--cm-text);
            display: flex;
            align-items: center;
        }
        .cm-topbar-spacer { flex: 1; }
        .cm-topbar-badge {
            display: flex; align-items: center; gap: 6px;
            background: #E3F2FD;
            color: var(--cm-primary);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: .78rem;
            font-weight: 600;
        }

        /* ── CONTENT ── */
        .cm-content { padding: 28px; flex: 1; }

        /* ── CARD ── */
        .cm-card {
            background: var(--cm-surface);
            border-radius: var(--cm-radius);
            box-shadow: var(--cm-shadow);
            border: 1px solid var(--cm-border);
            padding: 24px;
            margin-bottom: 20px;
        }
        .cm-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .cm-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--cm-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cm-card-title i { color: var(--cm-primary); }

        /* ── DATATABLE ── */
        .cm-card .p-datatable .p-datatable-thead > tr > th {
            background: #F8FAFC !important;
            color: #546E7A !important;
            font-size: .78rem !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: .5px !important;
            border-bottom: 2px solid #E0E0E0 !important;
            padding: 10px 14px !important;
        }
        .cm-card .p-datatable .p-datatable-tbody > tr > td {
            padding: 11px 14px !important;
            font-size: .88rem !important;
            border-bottom: 1px solid #F0F0F0 !important;
            vertical-align: middle;
        }
        .cm-card .p-datatable .p-datatable-tbody > tr:hover > td {
            background: #F3F8FD !important;
        }
        .cm-card .p-datatable .p-paginator {
            background: transparent !important;
            border-top: 1px solid var(--cm-border) !important;
            border-bottom: none !important;
            padding: 10px 0 0 !important;
        }

        /* ── DIALOG ── */
        .p-dialog .p-dialog-header {
            background: var(--cm-primary) !important;
            color: white !important;
            border-radius: var(--cm-radius) var(--cm-radius) 0 0 !important;
            padding: 14px 20px !important;
        }
        .p-dialog .p-dialog-header .p-dialog-title {
            font-size: .95rem !important;
            font-weight: 700 !important;
        }
        .p-dialog .p-dialog-header .p-dialog-header-icon {
            color: rgba(255,255,255,.8) !important;
        }
        .p-dialog .p-dialog-header .p-dialog-header-icon:hover {
            color: white !important;
            background: rgba(255,255,255,.15) !important;
        }
        .p-dialog .p-dialog-content { padding: 20px !important; }
        .p-dialog .p-dialog-footer {
            padding: 12px 20px !important;
            border-top: 1px solid var(--cm-border) !important;
            text-align: right;
        }

        /* ── FORM GRID ── */
        .cm-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .cm-form-grid .cm-field-full { grid-column: 1 / -1; }
        .cm-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cm-field label {
            font-size: .8rem;
            font-weight: 600;
            color: #546E7A;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .cm-field .p-inputtext,
        .cm-field .p-inputtextarea,
        .cm-field .p-dropdown,
        .cm-field .p-calendar .p-inputtext { width: 100% !important; }

        /* ── BOTÕES ── */
        .btn-edit {
            background: #FFF8E1 !important;
            color: #F57F17 !important;
            border: 1px solid #FFE082 !important;
            border-radius: 6px !important;
            padding: 4px 8px !important;
            margin-right: 4px;
        }
        .btn-edit:hover { background: #FFE082 !important; }

        .btn-delete {
            background: #FFEBEE !important;
            color: #C62828 !important;
            border: 1px solid #FFCDD2 !important;
            border-radius: 6px !important;
            padding: 4px 8px !important;
        }
        .btn-delete:hover { background: #FFCDD2 !important; }

        .btn-cancel-consult {
            background: #FFF3E0 !important;
            color: #E65100 !important;
            border: 1px solid #FFCC80 !important;
            border-radius: 6px !important;
            padding: 4px 10px !important;
        }
        .btn-cancel-consult:hover { background: #FFE0B2 !important; }

        .btn-primary-action,
        .btn-primary-action .p-button {
            background: var(--cm-primary) !important;
            border-color: var(--cm-primary) !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            font-size: .88rem !important;
        }
        .btn-primary-action:hover,
        .btn-primary-action .p-button:hover {
            background: var(--cm-primary-d) !important;
            border-color: var(--cm-primary-d) !important;
        }

        /* ── MISC ── */
        .p-tag { border-radius: 20px !important; font-size: .75rem !important; padding: 3px 10px !important; }
        .p-growl-item-container, .p-toast-message { border-radius: var(--cm-radius) !important; }
        .p-confirm-dialog .p-dialog-content { gap: 12px; display: flex; align-items: center; }
        .p-confirm-dialog .p-confirm-dialog-message { font-size: .9rem; }

        @media (max-width: 768px) {
            .cm-sidebar { transform: translateX(-100%); }
            .cm-main { margin-left: 0; }
            .cm-content { padding: 16px; }
            .cm-form-grid { grid-template-columns: 1fr; }
        }
    </style>
</h:head>

<h:body>
    <div class="cm-wrapper">

        <!-- ══ SIDEBAR ══ -->
        <aside class="cm-sidebar">

            <a href="#{request.contextPath}/admin/medico.xhtml" class="cm-sidebar-logo">
                <span class="logo-icon">&#127973;</span>
                <span>Cl&#237;nica M&#233;dica</span>
            </a>

            <div class="cm-menu-section">
                <div class="cm-menu-section-label">Cadastros</div>
                <ul>
                    <li>
                        <h:outputLink value="#{request.contextPath}/admin/dashboard.xhtml">
                            <i class="pi pi-home"/>
                            <span>Dashboard</span>
                        </h:outputLink>
                    </li>
                    <li>
                        <h:outputLink value="#{request.contextPath}/admin/especialidade.xhtml">
                            <i class="pi pi-th-large"/>
                            <span>Especialidades</span>
                        </h:outputLink>
                    </li>
                    <li>
                        <h:outputLink value="#{request.contextPath}/admin/medico.xhtml">
                            <i class="pi pi-user-edit"/>
                            <span>M&#233;dicos</span>
                        </h:outputLink>
                    </li>
                    <li>
                        <h:outputLink value="#{request.contextPath}/admin/paciente.xhtml">
                            <i class="pi pi-users"/>
                            <span>Pacientes</span>
                        </h:outputLink>
                    </li>
                </ul>
            </div>

            <div class="cm-menu-section">
                <div class="cm-menu-section-label">Atendimento</div>
                <ul>
                    <li>
                        <h:outputLink value="#{request.contextPath}/admin/consulta.xhtml">
                            <i class="pi pi-calendar"/>
                            <span>Consultas</span>
                        </h:outputLink>
                    </li>
                </ul>
            </div>

            <div class="cm-sidebar-footer">
                <div class="avatar">A</div>
                <div class="user-info">
                    <div class="user-name">Administrador</div>
                    <div class="user-role">Sistema</div>
                </div>
                <!-- botão nativo HTML — aciona o form oculto dentro do cm-main -->
                <button type="button"
                        class="cm-logout-btn"
                        title="Sair do sistema"
                        onclick="document.getElementById('formLogout:btnLogout').click()">
                    <i class="pi pi-sign-out"/>
                </button>
            </div>

        </aside>

        <!-- ══ ÁREA PRINCIPAL ══ -->
        <div class="cm-main">

            <header class="cm-topbar">
                <span class="cm-topbar-title">
                    <ui:insert name="pageTitle">Cl&#237;nica M&#233;dica</ui:insert>
                </span>
                <span class="cm-topbar-spacer"/>
                <span class="cm-topbar-badge">
                    <i class="pi pi-circle-fill" style="font-size:.5rem"/>
                    Online
                </span>
            </header>

            <main class="cm-content">
                <ui:insert name="content">Conte&#250;do aqui</ui:insert>
            </main>

            <!-- form de logout FORA da sidebar, dentro do cm-main -->
            <h:form id="formLogout" style="display:none">
                <p:commandButton id="btnLogout"
                                 action="#{loginController.logout}"/>
            </h:form>

        </div>

    </div>

    <h:outputScript library="manhattan-layout" name="js/layout.js"/>
</h:body>
</html>
