<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login - Clínica Médica</title>
    <h:outputStylesheet library="manhattan-layout" name="css/layout-blue-grey.css"/>
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f4f4;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 1.5rem;
            color: #455a64;
        }
        .login-card .p-field {
            margin-bottom: 1rem;
            text-align: left;
        }
        .login-card .p-inputtext {
            width: 100%;
        }
        .login-btn {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</h:head>

<h:body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>🏥 Clínica Médica</h2>
            <h:form>
                <p:messages showDetail="true" closable="true"/>

                <div class="p-field">
                    <p:outputLabel for="usuario" value="Usuário"/>
                    <p:inputText id="usuario" value="#{loginController.usuario}"
                                 placeholder="Digite seu usuário" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel for="senha" value="Senha"/>
                    <p:password id="senha" value="#{loginController.senha}"
                                placeholder="Digite sua senha" required="true" feedback="false"/>
                </div>

                <p:commandButton value="Entrar" action="#{loginController.login}"
                                 styleClass="login-btn" icon="pi pi-sign-in"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
