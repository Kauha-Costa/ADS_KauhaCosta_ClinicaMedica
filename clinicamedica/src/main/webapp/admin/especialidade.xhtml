<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">

        <p:growl id="growl" showDetail="true"/>

        <p:toolbar>
            <p:toolbarGroup>
                <p:commandButton value="Nova Especialidade" icon="pi pi-plus"
                                 actionListener="#{especialidadeController.prepareAdicionar}"
                                 update="formDialog" oncomplete="PF('dlgEspecialidade').show()"/>
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable value="#{especialidadeController.lista}" var="esp"
                     style="margin-top:1rem" paginator="true" rows="10"
                     emptyMessage="Nenhuma especialidade cadastrada.">
            <p:column headerText="ID">
                <h:outputText value="#{esp.id}"/>
            </p:column>
            <p:column headerText="Nome">
                <h:outputText value="#{esp.nome}"/>
            </p:column>
            <p:column headerText="Descrição">
                <h:outputText value="#{esp.descricao}"/>
            </p:column>
            <p:column headerText="Ações" style="width:120px; text-align:center">
                <p:commandButton icon="pi pi-pencil" styleClass="p-button-warning p-button-sm"
                                 style="margin-right:4px"
                                 actionListener="#{especialidadeController.setEspecialidade(esp)}"
                                 update="formDialog" oncomplete="PF('dlgEspecialidade').show()"/>
                <p:commandButton icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                 actionListener="#{especialidadeController.setEspecialidade(esp)}"
                                 oncomplete="PF('dlgConfirm').show()"/>
            </p:column>
        </p:dataTable>

        <!-- DIALOG CADASTRO/EDIÇÃO -->
        <p:dialog header="Especialidade" widgetVar="dlgEspecialidade" modal="true" width="400">
            <h:form id="formDialog">
                <p:messages showDetail="true"/>
                <p:panelGrid columns="2" style="width:100%">
                    <p:outputLabel value="Nome *"/>
                    <p:inputText value="#{especialidadeController.especialidade.nome}" required="true"/>
                    <p:outputLabel value="Descrição"/>
                    <p:inputTextarea value="#{especialidadeController.especialidade.descricao}" rows="3"/>
                </p:panelGrid>
                <div style="margin-top:1rem; text-align:right">
                    <p:commandButton value="Salvar" icon="pi pi-check"
                                     actionListener="#{especialidadeController.salvar('CREATE')}"
                                     rendered="#{especialidadeController.especialidade.id == null}"
                                     update=":growl" oncomplete="PF('dlgEspecialidade').hide()"/>
                    <p:commandButton value="Atualizar" icon="pi pi-check"
                                     actionListener="#{especialidadeController.salvar('UPDATE')}"
                                     rendered="#{especialidadeController.especialidade.id != null}"
                                     update=":growl" oncomplete="PF('dlgEspecialidade').hide()"/>
                    <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="p-button-secondary"
                                     style="margin-left:4px" onclick="PF('dlgEspecialidade').hide()" type="button"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- DIALOG CONFIRMAÇÃO EXCLUSÃO -->
        <p:confirmDialog widgetVar="dlgConfirm" message="Deseja realmente excluir esta especialidade?"
                         header="Confirmar Exclusão" severity="warn">
            <h:form>
                <p:commandButton value="Sim" icon="pi pi-check" styleClass="p-button-danger"
                                 actionListener="#{especialidadeController.salvar('DELETE')}"
                                 update=":growl" oncomplete="PF('dlgConfirm').hide()"/>
                <p:commandButton value="Não" icon="pi pi-times" styleClass="p-button-secondary"
                                 onclick="PF('dlgConfirm').hide()" type="button"/>
            </h:form>
        </p:confirmDialog>

    </ui:define>
</ui:composition>
</html>
