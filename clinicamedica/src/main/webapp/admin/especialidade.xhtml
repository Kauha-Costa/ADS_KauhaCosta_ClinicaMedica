<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/WEB-INF/template.xhtml">

        <ui:define name="pageTitle">
            <i class="pi pi-th-large" style="color:#1976D2; margin-right:8px;"/>
            Especialidades
        </ui:define>

        <ui:define name="content">

            <p:growl id="growl" showDetail="true" life="4000"/>

            <div class="cm-card">

                <!-- Cabeçalho -->
                <div class="cm-card-header">
                    <div class="cm-card-title">
                        <i class="pi pi-th-large"/>
                        Especialidades Cadastradas
                    </div>
                    <p:commandButton value="Nova Especialidade"
                                     icon="pi pi-plus"
                                     styleClass="btn-primary-action"
                                     actionListener="#{especialidadeController.prepareAdicionar}"
                                     update="formDialog"
                                     oncomplete="PF('dlgEspecialidade').show()"/>
                </div>

                <!-- Tabela -->
                <p:dataTable id="tabelaEspecialidade"
                             value="#{especialidadeController.lista}"
                             var="esp"
                             paginator="true"
                             rows="10"
                             rowsPerPageTemplate="5,10,20"
                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             emptyMessage="Nenhuma especialidade cadastrada."
                             stripedRows="true"
                             rowHover="true"
                             filterDisplay="row">

                    <p:column headerText="ID" sortBy="#{esp.id}" style="width:70px; text-align:center">
                        <h:outputText value="#{esp.id}"/>
                    </p:column>

                    <p:column headerText="Nome" sortBy="#{esp.nome}" filterBy="#{esp.nome}"
                              filterMatchMode="contains" filterPlaceholder="Filtrar...">
                        <h:outputText value="#{esp.nome}"/>
                    </p:column>

                    <p:column headerText="Descri&#231;&#227;o" filterBy="#{esp.descricao}"
                              filterMatchMode="contains" filterPlaceholder="Filtrar...">
                        <h:outputText value="#{esp.descricao}"/>
                    </p:column>

                    <p:column headerText="A&#231;&#245;es" style="width:110px; text-align:center">
                        <p:commandButton icon="pi pi-pencil"
                                         styleClass="btn-edit"
                                         title="Editar"
                                         actionListener="#{especialidadeController.setEspecialidade(esp)}"
                                         update="formDialog"
                                         oncomplete="PF('dlgEspecialidade').show()"/>
                        <p:commandButton icon="pi pi-trash"
                                         styleClass="btn-delete"
                                         title="Excluir"
                                         actionListener="#{especialidadeController.setEspecialidade(esp)}"
                                         oncomplete="PF('dlgConfirm').show()"/>
                    </p:column>

                </p:dataTable>
            </div>

            <!-- ══ DIALOG CADASTRO / EDIÇÃO ══ -->
            <p:dialog header="#{especialidadeController.especialidade.id == null ? 'Nova Especialidade' : 'Editar Especialidade'}"
                      widgetVar="dlgEspecialidade"
                      modal="true"
                      width="440"
                      resizable="false"
                      closable="true">

                <h:form id="formDialog">
                    <p:messages id="dlgMsgs" showDetail="true" closable="true"/>

                    <div class="cm-form-grid" style="grid-template-columns:1fr;">

                        <div class="cm-field">
                            <p:outputLabel for="nome" value="Nome *"/>
                            <p:inputText id="nome"
                                         value="#{especialidadeController.especialidade.nome}"
                                         required="true"
                                         requiredMessage="Informe o nome."
                                         maxlength="500"
                                         placeholder="Ex: Cardiologia"/>
                        </div>

                        <div class="cm-field">
                            <p:outputLabel for="descricao" value="Descri&#231;&#227;o"/>
                            <p:inputTextarea id="descricao"
                                             value="#{especialidadeController.especialidade.descricao}"
                                             rows="3"
                                             autoResize="false"
                                             placeholder="Descri&#231;&#227;o da especialidade (opcional)"/>
                        </div>

                    </div>

                    <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:8px;">
                        <p:commandButton value="Cancelar"
                                         icon="pi pi-times"
                                         styleClass="p-button-secondary p-button-outlined"
                                         onclick="PF('dlgEspecialidade').hide()"
                                         type="button"/>
                        <p:commandButton value="Salvar"
                                         icon="pi pi-check"
                                         styleClass="btn-primary-action"
                                         actionListener="#{especialidadeController.salvar('CREATE')}"
                                         rendered="#{especialidadeController.especialidade.id == null}"
                                         update=":growl :tabelaEspecialidade dlgMsgs"
                                         oncomplete="handleDlg(xhr, status, args, 'dlgEspecialidade')"/>
                        <p:commandButton value="Atualizar"
                                         icon="pi pi-check"
                                         styleClass="btn-primary-action"
                                         actionListener="#{especialidadeController.salvar('UPDATE')}"
                                         rendered="#{especialidadeController.especialidade.id != null}"
                                         update=":growl :tabelaEspecialidade dlgMsgs"
                                         oncomplete="handleDlg(xhr, status, args, 'dlgEspecialidade')"/>
                    </div>
                </h:form>
            </p:dialog>

            <!-- ══ DIALOG CONFIRMAÇÃO EXCLUSÃO ══ -->
            <p:confirmDialog widgetVar="dlgConfirm"
                             message="Deseja realmente excluir esta especialidade? Esta a&#231;&#227;o n&#227;o pode ser desfeita."
                             header="Confirmar Exclus&#227;o"
                             severity="warn"
                             width="400">
                <h:form>
                    <p:commandButton value="Sim, excluir"
                                     icon="pi pi-trash"
                                     styleClass="p-button-danger"
                                     actionListener="#{especialidadeController.salvar('DELETE')}"
                                     update=":growl :tabelaEspecialidade"
                                     oncomplete="PF('dlgConfirm').hide()"/>
                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     styleClass="p-button-secondary p-button-outlined"
                                     style="margin-left:6px"
                                     onclick="PF('dlgConfirm').hide()"
                                     type="button"/>
                </h:form>
            </p:confirmDialog>

            <script>
                //<![CDATA[
                function handleDlg(xhr, status, args, widgetVar) {
                    if (args && !args.validationFailed) {
                        PF(widgetVar).hide();
                    }
                }
                //]]>
            </script>

        </ui:define>
    </ui:composition>
</html>
