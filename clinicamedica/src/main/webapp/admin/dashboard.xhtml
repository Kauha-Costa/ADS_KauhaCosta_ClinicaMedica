<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<ui:composition template="/WEB-INF/template.xhtml">

    <ui:define name="pageTitle">
        <i class="pi pi-home" style="color:#1976D2; margin-right:8px;"/>
        Dashboard
    </ui:define>

    <ui:define name="content">

        <style>
            .dash-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                margin-bottom: 28px;
            }

            .dash-card {
                background: #fff;
                border-radius: 14px;
                padding: 24px 20px;
                display: flex;
                align-items: center;
                gap: 18px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.07);
                border: 1px solid #ECEFF1;
                transition: transform .15s, box-shadow .15s;
            }

            .dash-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(0,0,0,0.11);
            }

            .dash-icon {
                width: 56px;
                height: 56px;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                flex-shrink: 0;
            }

            .dash-icon.blue   { background: #E3F2FD; color: #1565C0; }
            .dash-icon.green  { background: #E8F5E9; color: #2E7D32; }
            .dash-icon.orange { background: #FFF3E0; color: #E65100; }
            .dash-icon.purple { background: #F3E5F5; color: #6A1B9A; }

            .dash-info { display: flex; flex-direction: column; }

            .dash-number {
                font-size: 2rem;
                font-weight: 800;
                color: #263238;
                line-height: 1;
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-label {
                font-size: .78rem;
                color: #90A4AE;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .5px;
                margin-top: 4px;
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .dash-panel {
                background: #fff;
                border-radius: 14px;
                border: 1px solid #ECEFF1;
                box-shadow: 0 2px 12px rgba(0,0,0,0.07);
                overflow: hidden;
            }

            .dash-panel-header {
                padding: 16px 20px;
                border-bottom: 1px solid #ECEFF1;
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: .85rem;
                font-weight: 700;
                color: #37474F;
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-panel-header i {
                color: #1976D2;
                font-size: 1rem;
            }

            .dash-empty {
                padding: 32px;
                text-align: center;
                color: #B0BEC5;
                font-size: .83rem;
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-welcome {
                background: linear-gradient(135deg, #1976D2, #0D47A1);
                border-radius: 14px;
                padding: 28px 32px;
                margin-bottom: 24px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                box-shadow: 0 4px 20px rgba(25,118,210,0.3);
            }

            .dash-welcome-text h2 {
                margin: 0 0 6px;
                font-size: 1.4rem;
                font-weight: 800;
                color: #fff;
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-welcome-text p {
                margin: 0;
                font-size: .85rem;
                color: rgba(255,255,255,0.7);
                font-family: 'Segoe UI', sans-serif;
            }

            .dash-welcome-icon {
                font-size: 3.5rem;
                opacity: .4;
            }
        </style>

        <!-- ══ BOAS VINDAS ══ -->
        <div class="dash-welcome">
            <div class="dash-welcome-text">
                <h2>Bem-vindo ao Sistema!</h2>
                <p>Gerencie consultas, médicos e pacientes da Clínica Médica.</p>
            </div>
            <i class="pi pi-heart dash-welcome-icon" style="color:#fff"/>
        </div>

        <!-- ══ CARDS DE TOTAIS ══ -->
        <div class="dash-grid">

            <div class="dash-card">
                <div class="dash-icon blue">
                    <i class="pi pi-user-edit"/>
                </div>
                <div class="dash-info">
                    <span class="dash-number">
                        <h:outputText value="#{dashboardController.totalMedicos}"/>
                    </span>
                    <span class="dash-label">Médicos</span>
                </div>
            </div>

            <div class="dash-card">
                <div class="dash-icon green">
                    <i class="pi pi-users"/>
                </div>
                <div class="dash-info">
                    <span class="dash-number">
                        <h:outputText value="#{dashboardController.totalPacientes}"/>
                    </span>
                    <span class="dash-label">Pacientes</span>
                </div>
            </div>

            <div class="dash-card">
                <div class="dash-icon orange">
                    <i class="pi pi-calendar"/>
                </div>
                <div class="dash-info">
                    <span class="dash-number">
                        <h:outputText value="#{dashboardController.totalConsultasAgendadas}"/>
                    </span>
                    <span class="dash-label">Consultas Agendadas</span>
                </div>
            </div>

            <div class="dash-card">
                <div class="dash-icon purple">
                    <i class="pi pi-th-large"/>
                </div>
                <div class="dash-info">
                    <span class="dash-number">
                        <h:outputText value="#{dashboardController.totalEspecialidades}"/>
                    </span>
                    <span class="dash-label">Especialidades</span>
                </div>
            </div>

        </div>

        <!-- ══ TABELAS RESUMO ══ -->
        <div class="dash-section">

            <!-- Próximas Consultas -->
            <div class="dash-panel">
                <div class="dash-panel-header">
                    <i class="pi pi-calendar-plus"/>
                    Próximas Consultas Agendadas
                </div>
                <p:dataTable value="#{consultaController.listaAgendadas}"
                             var="con"
                             rows="5"
                             emptyMessage="Nenhuma consulta agendada."
                             styleClass="dash-table">
                    <p:column headerText="Paciente">
                        <h:outputText value="#{con.paciente.nome}"/>
                    </p:column>
                    <p:column headerText="Médico">
                        <h:outputText value="#{con.medico.nome}"/>
                    </p:column>
                    <p:column headerText="Data / Hora" style="width:140px">
                        <h:outputText value="#{con.datahoraconsulta}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
            </div>

            <!-- Médicos Cadastrados -->
            <div class="dash-panel">
                <div class="dash-panel-header">
                    <i class="pi pi-user-edit"/>
                    Médicos Cadastrados
                </div>
                <p:dataTable value="#{medicoController.lista}"
                             var="med"
                             rows="5"
                             emptyMessage="Nenhum médico cadastrado."
                             styleClass="dash-table">
                    <p:column headerText="Nome">
                        <h:outputText value="#{med.nome}"/>
                    </p:column>
                    <p:column headerText="Especialidade">
                        <p:tag value="#{med.especialidade.nome}"
                               style="background:#E3F2FD; color:#1565C0; font-size:.72rem;"/>
                    </p:column>
                    <p:column headerText="CRM" style="width:110px">
                        <h:outputText value="#{med.crm}"/>
                    </p:column>
                </p:dataTable>
            </div>

        </div>

    </ui:define>
</ui:composition>
</html>
