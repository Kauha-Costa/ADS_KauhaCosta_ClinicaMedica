<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login &#8212; Clínica Médica</title>
    <h:outputStylesheet library="manhattan-layout" name="css/layout-blue-grey.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body, .layout-wrapper {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100vh !important;
            min-height: 100vh !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #0D1B2A !important;
        }

        .layout-wrapper > *:not(.login-wrapper) {
            display: none !important;
        }

        /* ── FUNDO ANIMADO ── */
        .login-wrapper {
            position: relative;
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(25,118,210,0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(13,71,161,0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 60% 80%, rgba(21,101,192,0.3) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0%   { opacity: .7; }
            100% { opacity: 1; }
        }

        /* ── CARD ── */
        .login-card {
            position: relative;
            z-index: 10;
            width: 400px;
            background: rgba(255,255,255,0.04) !important;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px !important;
            box-shadow:
                0 24px 64px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08) !important;
            backdrop-filter: blur(24px);
            overflow: hidden;
        }

        /* ── TOPO ── */
        .lc-header {
            padding: 36px 32px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .lc-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #1976D2, #0D47A1);
            box-shadow: 0 8px 24px rgba(25,118,210,0.45);
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .lc-header h2 {
            margin: 0 0 6px;
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: -.3px;
        }

        .lc-header p {
            margin: 0;
            font-size: .8rem;
            color: rgba(255,255,255,0.45);
            font-family: 'Segoe UI', sans-serif;
        }

        /* ── FORMULÁRIO ── */
        .lc-body {
            padding: 28px 32px 24px;
            display: flex;
            justify-content: center;
        }

        .lc-body form {
            width: 100%;
        }

        .lc-field {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lc-field label,
        .lc-field .p-outputlabel {
            display: block !important;
            width: 100%;
            max-width: 320px;
            text-align: left;
            font-size: .7rem !important;
            font-weight: 700 !important;
            color: rgba(255,255,255,0.45) !important;
            text-transform: uppercase !important;
            letter-spacing: .8px !important;
            margin-bottom: 7px !important;
            font-family: 'Segoe UI', sans-serif !important;
}

        .lc-input-wrap {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .lc-input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: .95rem;
            pointer-events: none;
            z-index: 1;
        }

        .lc-field .p-inputtext,
        .lc-field .p-password input {
            display: block !important;
            width: 100% !important;
            background: rgba(255,255,255,0.06) !important;
            border: 1.5px solid rgba(255,255,255,0.10) !important;
            border-radius: 10px !important;
            padding: 11px 14px 11px 38px !important;
            font-size: .88rem !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', sans-serif !important;
            transition: border-color .2s, background .2s, box-shadow .2s !important;
        }

        .lc-field .p-inputtext::placeholder,
        .lc-field .p-password input::placeholder {
            color: rgba(255,255,255,0.25) !important;
        }

        .lc-field .p-inputtext:focus,
        .lc-field .p-password input:focus {
            border-color: #1976D2 !important;
            background: rgba(25,118,210,0.10) !important;
            box-shadow: 0 0 0 3px rgba(25,118,210,0.20) !important;
            outline: none !important;
        }

        .lc-field .p-password {
            display: block !important;
            width: 100% !important;
        }

        /* ── BOTÃO ── */
        .lc-btn {
            margin-top: 8px;
            display: flex;
            justify-content: center;
        }

        .lc-btn .p-button {
            display: flex !important;
            width: 320px !important;
            justify-content: center !important;
            background: linear-gradient(135deg, #1976D2, #1565C0) !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 12px !important;
            font-size: .92rem !important;
            font-weight: 700 !important;
            color: #fff !important;
            letter-spacing: .3px;
            box-shadow: 0 4px 16px rgba(25,118,210,0.4) !important;
            transition: all .2s !important;
        }

        .lc-btn .p-button:hover {
            background: linear-gradient(135deg, #1565C0, #0D47A1) !important;
            box-shadow: 0 6px 20px rgba(25,118,210,0.55) !important;
            transform: translateY(-1px);
        }

        .lc-btn .p-button:active {
            transform: translateY(0);
        }

        /* ── MENSAGENS ── */
        .p-messages {
            border-radius: 10px !important;
            margin-bottom: 18px !important;
            font-size: .83rem !important;
            background: rgba(211,47,47,0.15) !important;
            border: 1px solid rgba(211,47,47,0.3) !important;
        }

        /* ── RODAPÉ ── */
        .lc-footer {
            border-top: 1px solid rgba(255,255,255,0.07);
            padding: 14px 32px;
            text-align: center;
            font-size: .71rem;
            color: rgba(255,255,255,0.25);
            font-family: 'Segoe UI', sans-serif;
        }
        
        
    </style>
</h:head>

<h:body>
    <div class="layout-wrapper">
        <div class="login-wrapper">
            <div class="login-card">

                <div class="lc-header">
                    <div class="lc-icon-wrap">&#127973;</div>
                    <h2>Clínica Médica</h2>
                    <p>Sistema de Gestão de Consultas</p>
                </div>

                <div class="lc-body">
                    <h:form>
                        <p:messages id="msgs" showDetail="true" closable="false"/>

                        <div class="lc-field">
                            <p:outputLabel for="usuario" value="Usuário"/>
                            <div class="lc-input-wrap">
                                <i class="pi pi-user lc-input-icon"/>
                                <p:inputText id="usuario"
                                             value="#{loginController.usuario}"
                                             placeholder="Digite seu usuário"
                                             required="true"
                                             requiredMessage="Informe o usuário."
                                             autocomplete="username"/>
                            </div>
                        </div>

                        <div class="lc-field">
                            <p:outputLabel for="senha" value="Senha"/>
                            <div class="lc-input-wrap">
                                <i class="pi pi-lock lc-input-icon"/>
                                <p:password id="senha"
                                            value="#{loginController.senha}"
                                            placeholder="Digite sua senha"
                                            required="true"
                                            requiredMessage="Informe a senha."
                                            feedback="false"
                                            autocomplete="current-password"/>
                            </div>
                        </div>

                        <div class="lc-btn">
                            <p:commandButton value="Entrar"
                                             icon="pi pi-sign-in"
                                             iconPos="right"
                                             action="#{loginController.login}"
                                             update="msgs"/>
                        </div>
                    </h:form>
                </div>

                <div class="lc-footer">
                    Clínica M&#233;dica &#169; 2025 &#8212; Todos os direitos reservados
                </div>

            </div>
        </div>
    </div>
</h:body>
</html>
